concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  nix-flake-check:
    name: Check Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      - name: Create passwords database stub for the installer image
        run: |
          sudo mkdir -p /home/bmr/Documents
          sudo touch /home/bmr/Documents/passwords.kdbx
      - name: Check flake
        run: nix flake check --print-build-logs --impure
name: Evaluate the flake and run its checks
on: push
permissions: {}
